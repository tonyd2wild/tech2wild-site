name = "tech2wild-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Applications from the "Join the Lab" form (functions/api/apply.ts)
[[d1_databases]]
binding = "DB"
database_name = "tech2wild-lab"
database_id = "4a79850c-b517-420a-8e28-7a9a3209574d"

# Secrets are set in the Cloudflare dashboard (Pages project → Settings → Variables and Secrets):
#   TURNSTILE_SECRET  — Turnstile widget secret key (required)
#   DISCORD_WEBHOOK   — Discord channel webhook URL (optional, posts each application)
#   GITHUB_TOKEN      — optional, raises GitHub API rate limits for the vetting lookup
